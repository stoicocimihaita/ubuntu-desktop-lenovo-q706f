# q706f: compressed swap in RAM, twice the RAM size (~15 GB on the 8 GB tablet), zstd.
# zram only uses memory for what is actually swapped out (compressed, ~3:1 with zstd), so a
# large size is cheap until it is needed; systemd-oomd still acts on memory pressure.
[zram0]
zram-size = ram * 2
compression-algorithm = zstd
swap-priority = 100
