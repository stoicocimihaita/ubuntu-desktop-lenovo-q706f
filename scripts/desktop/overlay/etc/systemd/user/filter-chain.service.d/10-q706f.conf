# q706f (23.11.2026): after a boot the filter-chain daemon was "started" but its speaker headroom sink
# (60-q706f-speaker-headroom.conf) was missing until a manual restart; apps then played straight into
# the amps without the -8 dB. Start it after the session manager and restart it with PipeWire.
[Unit]
After=wireplumber.service
PartOf=pipewire.service

[Service]
Restart=on-failure
RestartSec=2
