# Lenovo Tab P12 Pro (q706f): THE switch for real suspend.
#
# Suspend (s2idle) was validated on 2026-11-13: four suspend/resume cycles, wake by RTC
# alarm and by the power button. A short power-button press and closing the cover blank
# the screen and suspend (q706f-screen-keys). Idle draw while suspended is still high
# (~150 mA), and no overnight test has been done yet.
#
# To go back to screen-off only: set AllowSuspend=no (takes effect immediately).
[Sleep]
AllowSuspend=yes
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
