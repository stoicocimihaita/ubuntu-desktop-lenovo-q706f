# Lenovo Tab P12 Pro (q706f, SM8250): sensors live on the SLPI ("sdsp").
# The Debian/Ubuntu wrapper /usr/bin/hexagonrpcd reads these variables.
# The firmware directory is populated by scripts/desktop/setup-sensors.sh
# (proprietary files, not shipped in this repo).
[Service]
Environment=hexagonrpcd_device=/dev/fastrpc-sdsp
Environment=hexagonrpcd_dsp=sdsp
Environment=hexagonrpcd_fw_dir=/usr/share/qcom/sm8250/Lenovo/q706f/
