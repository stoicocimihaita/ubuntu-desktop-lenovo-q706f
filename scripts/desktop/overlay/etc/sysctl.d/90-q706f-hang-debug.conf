# q706f: turn freezes into a panic with a backtrace in pstore (diagnosis of the 22.11.2026
# freezes under browser video and big downloads), then reboot after 10 s.
# The detectors exist from the 22.11.2026 build on (q706f-7.3.4-extra.config); older kernels
# just ignore the first four keys (systemd-sysctl logs a warning).
kernel.softlockup_panic = 1
kernel.hardlockup_panic = 1
kernel.hung_task_panic = 1
kernel.hung_task_timeout_secs = 60
# Remove this file once the freezes are understood.
kernel.panic_on_rcu_stall = 1
kernel.panic_on_oops = 1
kernel.panic = 10
