# TB-Q706F internal speakers: -8 dB trim, +3 dB @ 220 Hz, 4th-order high-pass 120 Hz, x42 limiter -9 dBTP.
# Bass voicing chosen by the owner by ear (23.11.2026). A missing limiter must fail module loading.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Speakers"
      media.name = "Speakers"
      filter.graph = {
        nodes = [
          { type = builtin name = gain_l label = linear control = { "Mult" = 0.39810717 "Add" = 0.0 } }
          { type = builtin name = gain_r label = linear control = { "Mult" = 0.39810717 "Add" = 0.0 } }
          { type = builtin name = bass_l label = bq_peaking control = { "Freq" = 220.0 "Q" = 0.9 "Gain" = 3.0 } }
          { type = builtin name = bass_r label = bq_peaking control = { "Freq" = 220.0 "Q" = 0.9 "Gain" = 3.0 } }
          { type = builtin name = hp_l1 label = bq_highpass control = { "Freq" = 120.0 "Q" = 0.5411961 "Gain" = 0.0 } }
          { type = builtin name = hp_l2 label = bq_highpass control = { "Freq" = 120.0 "Q" = 1.3065630 "Gain" = 0.0 } }
          { type = builtin name = hp_r1 label = bq_highpass control = { "Freq" = 120.0 "Q" = 0.5411961 "Gain" = 0.0 } }
          { type = builtin name = hp_r2 label = bq_highpass control = { "Freq" = 120.0 "Q" = 1.3065630 "Gain" = 0.0 } }
          { type = lv2 name = limiter plugin = "http://gareus.org/oss/lv2/dpl#stereo"
            control = { "enable" = 1 "gain" = 0.0 "threshold" = -9.0 "release" = 0.080 "truepeak" = 1 }
          }
        ]
        links = [
          { output = "gain_l:Out" input = "bass_l:In" }
          { output = "bass_l:Out" input = "hp_l1:In" }
          { output = "hp_l1:Out" input = "hp_l2:In" }
          { output = "hp_l2:Out" input = "limiter:inL" }
          { output = "gain_r:Out" input = "bass_r:In" }
          { output = "bass_r:Out" input = "hp_r1:In" }
          { output = "hp_r1:Out" input = "hp_r2:In" }
          { output = "hp_r2:Out" input = "limiter:inR" }
        ]
        inputs  = [ "gain_l:In" "gain_r:In" ]
        outputs = [ "limiter:outL" "limiter:outR" ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name = "q706f_speakers"
        media.class = Audio/Sink
        priority.session = 3000
        priority.driver = 3000
        q706f.speaker-protection = "hpf120-dpl"
      }
      playback.props = {
        node.name = "q706f_speakers.out"
        node.passive = true
        target.object = "alsa_output.platform-sound.HiFi__Speaker__sink"
        node.dont-fallback = true
        node.linger = true
        node.dont-move = true
        stream.dont-remix = true
      }
    }
  }
]
