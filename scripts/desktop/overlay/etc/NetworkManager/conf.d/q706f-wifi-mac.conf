# The Wi-Fi MAC address is set by udev (/usr/local/sbin/q706f-wifi-addr) before
# NetworkManager sees the device. Keep it: never fall back to the driver's
# "permanent" address (the generic Atheros one) and do not randomise it while
# scanning.
[device-q706f-wifi]
match-device=driver:ath11k_pci
wifi.scan-rand-mac-address=no

[connection-q706f-wifi]
match-device=driver:ath11k_pci
wifi.cloned-mac-address=preserve
