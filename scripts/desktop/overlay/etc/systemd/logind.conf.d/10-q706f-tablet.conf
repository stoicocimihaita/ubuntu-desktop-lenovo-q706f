# Lenovo Tab P12 Pro (q706f): the power button and the hall sensor (exposed
# as SW_LID, i.e. the folio cover) are handled inside the GNOME session by
# q706f-screen-keys (screen off / on).  logind must not power off or suspend
# on its own: wake-up from s2idle is not validated on this kernel yet.
# Real suspend is switched on in /etc/systemd/sleep.conf.d/10-q706f-suspend.conf.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
