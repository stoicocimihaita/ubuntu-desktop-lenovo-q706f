# Lenovo Tab P12 Pro (q706f): use the iio-sensor-proxy built with libssc
# (installed by scripts/desktop/setup-sensors.sh) instead of the archive
# binary, which has no Qualcomm SSC support.
[Unit]
Wants=hexagonrpcd.service
After=hexagonrpcd.service
ConditionPathExists=/usr/local/libexec/iio-sensor-proxy

[Service]
# The SLPI needs ~15 s after hexagonrpcd starts before sensors answer;
# sensor discovery only happens once at daemon start, so wait for them.
ExecStartPre=-/usr/local/libexec/q706f-wait-ssc
ExecStart=
ExecStart=/usr/local/libexec/iio-sensor-proxy
RestrictAddressFamilies=AF_UNIX AF_LOCAL AF_NETLINK AF_QIPCRTR
TimeoutStartSec=120
