# q706f: release ath11k_pci across system suspend and bind it again afterwards (patch 0121).
# With the driver kept, its resume after a CX collapse stops further deep-sleep (CXSD) entries
# while the ADSP runs (tests X1/X5, 20.11.2026). Replaces WIFI_UNLOAD_IN_SLEEP in the sleep hook
# once the running kernel carries 0121; an older ath11k_pci ignores the parameter.
options ath11k_pci unbind_in_suspend=1
