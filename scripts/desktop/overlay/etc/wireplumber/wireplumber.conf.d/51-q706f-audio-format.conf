# Lenovo Tab P12 Pro (q706f): force 16-bit PCM on the internal sound card.
# With S24_LE on the q6asm front end the ADSP outputs the samples 8 bits
# (48 dB) too low on the TDM bus, so the speakers are practically silent.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.platform-sound.*" }
      { node.name = "~alsa_input.platform-sound.*" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
      }
    }
  }
]
